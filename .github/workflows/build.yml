name: Build plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: ServerPack

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Compilar
        run: mvn -B -ntp -f ${{ env.PROJECT_DIR }}/pom.xml package

      - name: Guardar o .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: ${{ env.PROJECT_DIR }}/target/*.jar

      - name: Publicar release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/target/*.jar
